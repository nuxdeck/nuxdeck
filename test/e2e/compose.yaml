# SPDX-License-Identifier: Apache-2.0
#
# Isolated end-to-end stack. test/e2e/stack-up.sh runs it under a random project name and writes
# compose.env next to this file; nothing here names a container, so Compose prefixes every name
# with the project and the stack never collides with containers the operator already runs.
#
# Host ports are bound to 127.0.0.1 and are all above 1024. Every other service talks over the
# project network only.
#
# Agents read the host's Docker daemon through their sockguard sidecar. Sockguard is read-only
# (GET allowlist, see docs/08-engineering-spec.md), so the stack reads, and never writes, the
# operator's other containers' metadata. The sidecars are the only services that mount the socket.

services:
  nuxd:
    build:
      context: ./.stack
      dockerfile: ../docker/Dockerfile.nuxd
    image: nux-e2e-nuxd:${E2E_PROJECT}
    hostname: nuxd
    environment:
      NUXD_DATA_DIR: /var/lib/nuxd
      NUXD_HTTPS_ADDR: ":8443"
      NUXD_REDIRECT_ADDR: ":8080"
      NUXD_GATEWAY_ADDR: ":8444"
      # Agents dial the gateway by its project-network name; the certificate covers it.
      NUXD_GATEWAY_PUBLIC_URL: "https://nuxd:8444"
      NUXD_PUBLIC_URL: "https://localhost:${E2E_HTTPS_PORT}"
      NUXD_TLS_HOSTNAMES: "localhost,nuxd"
      NUXD_CHECKS_BLOCK_PRIVATE: "false"
      NUXD_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${E2E_HTTPS_PORT}:8443"
      - "127.0.0.1:${E2E_GATEWAY_PORT}:8444"
    # The alert webhook receiver runs on the test host and is reached through this name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nuxd-data:/var/lib/nuxd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # A plain web server whose access log the log-tail scenario reads.
  nginx:
    image: nginx:stable-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    labels:
      nux.e2e.role: web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Deliberately failing: its healthcheck never passes, and the uptime check and alert scenario
  # stops and starts it. It serves HTTP 200 on 8080 while it runs.
  # The image is the nginx one already pinned for nginx: alpine's busybox has no httpd applet.
  failing:
    image: nginx:stable-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    command: ["sh", "-c", "sed -i 's/listen  *80;/listen 8080;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    labels:
      nux.e2e.role: failing
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 1"]
      interval: 5s
      timeout: 2s
      retries: 1

  sockguard-a:
    image: nux-e2e-nux:${E2E_PROJECT}
    build:
      context: ./.stack
      dockerfile: ../docker/Dockerfile.nux
    command: ["sockguard", "--socket", "/run/nux/sockguard.sock", "--upstream", "/var/run/docker.sock"]
    group_add:
      - "${E2E_DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-a-run:/run/nux
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "test", "-S", "/run/nux/sockguard.sock"]
      interval: 1s
      timeout: 2s
      retries: 30

  sockguard-b:
    image: nux-e2e-nux:${E2E_PROJECT}
    command: ["sockguard", "--socket", "/run/nux/sockguard.sock", "--upstream", "/var/run/docker.sock"]
    group_add:
      - "${E2E_DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-b-run:/run/nux
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "test", "-S", "/run/nux/sockguard.sock"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Enrolled by the harness with `compose run` (the enrolment token is passed in the environment),
  # then started with `compose up`. Both agents run the same image; only the names differ.
  agent-a:
    image: nux-e2e-nux:${E2E_PROJECT}
    hostname: e2e-agent-a
    command: ["agent", "run"]
    environment:
      NUX_STATE_DIR: /var/lib/nux-agent
      NUX_SOCKGUARD_SOCKET: /run/nux/sockguard.sock
    volumes:
      - agent-a-state:/var/lib/nux-agent
      - agent-a-run:/run/nux
    depends_on:
      nuxd:
        condition: service_healthy
      sockguard-a:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent-b:
    image: nux-e2e-nux:${E2E_PROJECT}
    hostname: e2e-agent-b
    command: ["agent", "run"]
    environment:
      NUX_STATE_DIR: /var/lib/nux-agent
      NUX_SOCKGUARD_SOCKET: /run/nux/sockguard.sock
    volumes:
      - agent-b-state:/var/lib/nux-agent
      - agent-b-run:/run/nux
    depends_on:
      nuxd:
        condition: service_healthy
      sockguard-b:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # NFR-6: `nux backup` runs nuxd's backup, which needs nuxd stopped. Profile "backup".
  backup:
    image: nux-e2e-nux:${E2E_PROJECT}
    profiles: ["backup"]
    environment:
      NUXD_DATA_DIR: /var/lib/nuxd
    command: ["backup", "--out", "/backups/nux-e2e.nuxbak", "--passphrase-file", "/run/e2e/backup-passphrase"]
    volumes:
      - nuxd-data:/var/lib/nuxd
      - ./.stack/backup:/backups
      - ./.stack/backup-passphrase:/run/e2e/backup-passphrase:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Restores the archive into an empty volume. Profile "restore".
  restore:
    image: nux-e2e-nux:${E2E_PROJECT}
    profiles: ["restore"]
    command: ["restore", "--in", "/backups/nux-e2e.nuxbak", "--data-dir", "/var/lib/restored/nuxd", "--passphrase-file", "/run/e2e/backup-passphrase"]
    volumes:
      - restored-data:/var/lib/restored
      - ./.stack/backup:/backups:ro
      - ./.stack/backup-passphrase:/run/e2e/backup-passphrase:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Serves the restored data on its own host port so the restore can be checked through the API.
  nuxd-restored:
    image: nux-e2e-nuxd:${E2E_PROJECT}
    profiles: ["restore"]
    hostname: nuxd-restored
    environment:
      NUXD_DATA_DIR: /var/lib/restored/nuxd
      NUXD_HTTPS_ADDR: ":8443"
      NUXD_REDIRECT_ADDR: ":8080"
      NUXD_GATEWAY_ADDR: ":8444"
      NUXD_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${E2E_RESTORE_PORT}:8443"
    volumes:
      - restored-data:/var/lib/restored

volumes:
  nuxd-data:
  agent-a-state:
  agent-a-run:
  agent-b-state:
  agent-b-run:
  restored-data:
