components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nux_session
      description: Set by sign-in. Cookie requests that change state also send the CSRF token.
    bearerToken:
      type: http
      scheme: bearer
      description: A personal API token from `POST /me/tokens`. Scoped like the user who created it.

  headers:
    SessionCookie:
      description: HttpOnly, Secure, SameSite=Strict session cookie.
      schema:
        type: string
    ClearSessionCookie:
      description: Expires the session cookie.
      schema:
        type: string
    ETag:
      description: Version of the object. Send it back as If-Match on a write.
      schema:
        type: string

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required on writes that use the session cookie; the token comes from `POST /auth/login`, `GET /me`. Bearer requests do not need it.
      schema:
        type: string
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read. 428 when missing, 412 when stale.
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      description: Page size, from 1 to 500 (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor; pass the previous `next_cursor` back. Absent for the first page.
      schema:
        type: string
        maxLength: 64
    Tag:
      name: tag
      in: query
      description: Tag selector `key` or `key:value`, repeatable, at most 10.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 128
    ItemType:
      name: type
      in: path
      required: true
      description: Kind of inventory item.
      schema:
        type: string
        enum: [hosts, containers]
    ItemID:
      name: id
      in: path
      required: true
      description: Host or container ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    UserID:
      name: id
      in: path
      required: true
      description: User ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    SessionHandle:
      name: handle
      in: path
      required: true
      description: Session handle from a session list.
      schema:
        type: string
    TokenID:
      name: id
      in: path
      required: true
      description: API token ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    RoleBindingID:
      name: id
      in: path
      required: true
      description: Role binding ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    AgentID:
      name: id
      in: path
      required: true
      description: Agent ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    CheckID:
      name: id
      in: path
      required: true
      description: Check ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    RuleID:
      name: id
      in: path
      required: true
      description: Alert rule ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    AlertID:
      name: id
      in: path
      required: true
      description: Alert ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    SilenceID:
      name: id
      in: path
      required: true
      description: Silence ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ChannelID:
      name: id
      in: path
      required: true
      description: Notification channel ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    StatusPageID:
      name: id
      in: path
      required: true
      description: Status page ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    IncidentID:
      name: incidentId
      in: path
      required: true
      description: Incident ID.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    AuditActor:
      name: actor
      in: query
      description: Actor ID.
      schema:
        type: string
        maxLength: 256
    AuditAction:
      name: action
      in: query
      description: Action name prefix, for example `checks.`.
      schema:
        type: string
        maxLength: 256
    AuditTargetType:
      name: target_type
      in: query
      schema:
        type: string
        maxLength: 256
    AuditTargetID:
      name: target_id
      in: query
      schema:
        type: string
        maxLength: 256
    AuditResult:
      name: result
      in: query
      schema:
        type: string
        maxLength: 256
    AuditText:
      name: q
      in: query
      description: Text to find in the entry.
      schema:
        type: string
        maxLength: 256
    AuditFrom:
      name: from
      in: query
      description: Earliest time, RFC 3339.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Latest time, RFC 3339.
      schema:
        type: string
        format: date-time
    AuditCursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page, which is the ID of its last entry.
      schema:
        type: string
        pattern: "^[0-9]{1,19}$"

  responses:
    Error:
      description: Error in the shared shape. `code` is stable and documented in `internal/errcode/codes.go`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session or token, or the token is expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but the policy denies the action (or the CSRF token is missing or wrong).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found, or outside the caller's scope (indistinguishable on purpose).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: A field failed validation; `field` and `hint` say which and how to fix it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: The If-Match ETag is stale; reload and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: If-Match is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited or locked out. Wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Unexpected server error. The request ID in the server log has the detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message, hint]
      properties:
        code:
          type: string
          pattern: "^[A-Z]+(-[A-Z0-9]+)+$"
          examples: [API-NF-001, AUTH-RBAC-002]
        message:
          type: string
        hint:
          type: string
        field:
          type: string
          description: The request field at fault, when one is.
    NullableCursor:
      type: [string, "null"]
      maxLength: 64
      description: Pass back as `cursor` for the next page; null on the last page.
    Role:
      type: string
      enum: [admin, operator, viewer]
    Scope:
      type: object
      description: Limits a binding. Empty means every environment and tag set.
      properties:
        environments:
          type: array
          items:
            type: string
        tag_sets:
          type: array
          description: Each inner list is an AND of `key` or `key:value` tags; the outer list is an OR.
          items:
            type: array
            items:
              type: string
    Binding:
      type: object
      required: [role, scope]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        scope:
          $ref: "#/components/schemas/Scope"
    SetupStatus:
      type: object
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
    SetupAdminRequest:
      type: object
      required: [token, name, email, password]
      properties:
        token:
          type: string
          description: The setup token printed at first start.
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TOTPVerifyRequest:
      type: object
      required: [ticket, code]
      properties:
        ticket:
          type: string
          description: Ticket from the pending login.
        code:
          type: string
          description: Six-digit TOTP or a recovery code.
    TOTPPendingEnrolRequest:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
    TOTPEnrolment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
          description: otpauth:// URI for authenticator apps.
    PendingLogin:
      type: object
      required: [pending]
      additionalProperties: false
      properties:
        pending:
          type: object
          required: [ticket, expires_at, enrol_required]
          properties:
            ticket:
              type: string
            expires_at:
              type: string
              format: date-time
            enrol_required:
              type: boolean
              description: True when the account must enrol two-factor before it can sign in.
    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Send as X-CSRF-Token on cookie-authenticated writes.
        recovery_codes:
          type: array
          description: Present only when the session follows two-factor enrolment.
          items:
            type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    MySecurity:
      type: object
      required: [totp_enabled, recovery_codes_left, require_2fa]
      properties:
        totp_enabled:
          type: boolean
        recovery_codes_left:
          type: integer
        require_2fa:
          type: boolean
    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    TOTPDisableRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, ip, user_agent, current]
      properties:
        id:
          type: string
          description: Session handle for DELETE.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        current:
          type: boolean
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
    APIToken:
      type: object
      required: [id, name, bindings, created_at, expires_at, last_used_at]
      properties:
        id:
          type: string
        name:
          type: string
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
    CreateTokenRequest:
      type: object
      required: [name, expires_in_days, bindings]
      properties:
        name:
          type: string
        expires_in_days:
          type: integer
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
    CreatedToken:
      type: object
      required: [token, details]
      properties:
        token:
          type: string
          description: The plain token. Shown once; store it now.
        details:
          $ref: "#/components/schemas/APIToken"
    Account:
      type: object
      required: [id, email, name, role, disabled, totp_enabled, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        disabled:
          type: boolean
        totp_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    AccountList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/Account"
    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
    UpdateUserRequest:
      type: object
      description: Send only the fields to change.
      properties:
        name:
          type: string
        role:
          type: string
        disabled:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    SecuritySettings:
      type: object
      required: [require_2fa]
      properties:
        require_2fa:
          type: boolean
    RoleBindingRequest:
      type: object
      required: [subject_type, subject, role, scope]
      properties:
        subject_type:
          type: string
          enum: [user]
        subject:
          type: string
          description: User ID.
        role:
          $ref: "#/components/schemas/Role"
        scope:
          $ref: "#/components/schemas/Scope"
    RoleBinding:
      type: object
      required: [id, subject_type, subject, role, scope]
      properties:
        id:
          type: string
        subject_type:
          type: string
        subject:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        scope:
          $ref: "#/components/schemas/Scope"
        invalid:
          type: boolean
          description: True when the subject no longer exists.
    RoleBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    Settings:
      type: object
      description: Editable settings keyed by name.
      required: [telemetry.enabled, telemetry.locked, server.public_url, setup.completed]
      properties:
        telemetry.enabled:
          type: boolean
        telemetry.locked:
          type: boolean
          description: True when an environment setting fixes telemetry; the UI then shows it read-only.
        server.public_url:
          type: string
          description: The address agents and browsers use, as scheme and host with an optional port. Empty until set in the setup wizard.
        setup.completed:
          type: boolean
          description: True once the administrator has finished the setup wizard.
    SettingUpdate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          enum: ["telemetry.enabled", "server.public_url", "setup.completed"]
        value: {}
    TelemetryPayload:
      type: object
      description: Schema version 1 only. Fields are fixed by docs/01-vision.md.
      required: [schema_version, install_id, report_date, nuxd_version, release_channel, os, arch, distro_family, install_method, storage_backend, agents_bucket, clusters_bucket, checks_bucket, agent_versions, features, notifier_types, server_memory_mb_p95, server_uptime_bucket, restarts_24h, error_codes_24h]
      properties:
        schema_version:
          type: integer
        install_id:
          type: string
        report_date:
          type: string
        nuxd_version:
          type: string
        release_channel:
          type: string
        os:
          type: string
        arch:
          type: string
        distro_family:
          type: string
        install_method:
          type: string
        storage_backend:
          type: string
        agents_bucket:
          type: string
        clusters_bucket:
          type: string
        checks_bucket:
          type: string
        agent_versions:
          type: object
          additionalProperties:
            type: integer
        features:
          type: object
          additionalProperties:
            type: boolean
        notifier_types:
          type: array
          items:
            type: string
        server_memory_mb_p95:
          type: integer
        server_uptime_bucket:
          type: string
        restarts_24h:
          type: integer
        error_codes_24h:
          type: object
          additionalProperties:
            type: integer
    OIDCStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    OIDCSettings:
      type: object
      required: [configured, issuer, client_id, client_secret_set, scopes, groups_claim, allowed_domains, auto_provision, link_existing, redirect_uri]
      properties:
        configured:
          type: boolean
        issuer:
          type: string
        client_id:
          type: string
        client_secret_set:
          type: boolean
          description: Whether a secret is stored. The secret itself is never returned.
        scopes:
          type: array
          items:
            type: string
        groups_claim:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        auto_provision:
          type: boolean
        link_existing:
          type: boolean
        redirect_uri:
          type: string
          format: uri
    OIDCSettingsInput:
      type: object
      properties:
        issuer:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: Write-only. Omit to keep the stored secret.
        scopes:
          type: array
          items:
            type: string
        groups_claim:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        auto_provision:
          type: boolean
        link_existing:
          type: boolean
    AuditEntry:
      type: object
      required: [id, ts, actor_type, actor_id, action, target_type, target_id, ip, result, prev_hash, hash]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor_type:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        ip:
          type: string
        result:
          type: string
          enum: [success, failure]
        details:
          type: object
          description: Context of the action with secrets masked.
          additionalProperties: true
        prev_hash:
          type: string
        hash:
          type: string
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    AuditVerify:
      type: object
      required: [ok, entries]
      properties:
        ok:
          type: boolean
        entries:
          type: integer
          format: int64
        broken_at:
          type: integer
          format: int64
        reason:
          type: string
        code:
          type: string
    AgentTokenRequest:
      type: object
      properties:
        ttl_seconds:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
    AgentToken:
      type: object
      required: [id, token, expires_at]
      properties:
        id:
          type: string
        token:
          type: string
          description: The enrolment token. Shown once.
        expires_at:
          type: string
          format: date-time
    Port:
      type: object
      required: [host_ip, host_port, container_port, protocol]
      properties:
        host_ip:
          type: string
        host_port:
          type: integer
        container_port:
          type: integer
        protocol:
          type: string
    Host:
      type: object
      required: [id, agent_id, hostname, os, distro, kernel, arch, cpu_count, memory_bytes, facts, owner, tags, etag, status, first_seen_at, last_seen_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        hostname:
          type: string
        os:
          type: string
        distro:
          type: string
        kernel:
          type: string
        arch:
          type: string
        cpu_count:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        facts:
          type: object
          additionalProperties:
            type: string
        owner:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        etag:
          type: string
        status:
          type: string
          enum: [online, offline, gone]
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        gone_at:
          type: [string, "null"]
          format: date-time
    Container:
      type: object
      required: [id, host_id, runtime, runtime_id, name, image, state, ports, labels, owner, tags, etag, restart_count]
      properties:
        id:
          type: string
        host_id:
          type: string
        runtime:
          type: string
        runtime_id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"
        labels:
          type: object
          additionalProperties:
            type: string
        owner:
          type: string
        tags:
          type: object
          additionalProperties:
            type: string
        etag:
          type: string
        restart_count:
          type: integer
        created_at:
          type: [string, "null"]
          format: date-time
        gone_at:
          type: [string, "null"]
          format: date-time
    HostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    ContainerPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Container"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    InventoryEvent:
      type: object
      description: The data of one event. The SSE `id` line carries the sequence number.
      required: [type, at]
      properties:
        type:
          type: string
          enum: [host.created, host.updated, container.created, container.updated, container.removed, resync]
        at:
          type: string
          format: date-time
        item:
          description: The changed Host or Container; absent for resync.
          oneOf:
            - $ref: "#/components/schemas/Host"
            - $ref: "#/components/schemas/Container"
    TagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
    OwnerRequest:
      type: object
      properties:
        owner:
          type: [string, "null"]
          description: Omit or null to leave the owner unchanged; empty string to clear it.
    SearchHit:
      type: object
      required: [type, id, name, status, match, detail]
      properties:
        type:
          type: string
          enum: [host, container]
        id:
          type: string
        name:
          type: string
        status:
          type: string
        host:
          type: string
        match:
          type: string
          enum: [name, tag, ip]
        detail:
          type: string
    SearchResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
    MetricsSeries:
      type: object
      required: [metric, labels, points]
      properties:
        metric:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        points:
          type: array
          description: Each point is [unix milliseconds, value].
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
    MetricsResult:
      type: object
      required: [resolution, kind, unit, step_seconds, from, to, series]
      properties:
        resolution:
          type: string
        kind:
          type: string
        unit:
          type: string
        step_seconds:
          type: integer
          format: int64
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricsSeries"
    Pressure:
      type: object
      required: [id, name, cpu_percent, memory_percent, disk_percent, score, rank]
      properties:
        id:
          type: string
        name:
          type: string
        host_id:
          type: string
        cpu_percent:
          type: [number, "null"]
        memory_percent:
          type: [number, "null"]
        disk_percent:
          type: [number, "null"]
        score:
          type: [number, "null"]
          description: The highest of the three percentages.
        rank:
          type: object
          description: 1-based position by each dimension, worst first.
          additionalProperties:
            type: integer
    PressureReport:
      type: object
      required: [generated_at, window_seconds, hosts, containers]
      properties:
        generated_at:
          type: integer
          format: int64
          description: Unix milliseconds.
        window_seconds:
          type: integer
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Pressure"
        containers:
          type: array
          items:
            $ref: "#/components/schemas/Pressure"
    LogFrame:
      description: One WebSocket text frame. `type` decides the shape.
      oneOf:
        - $ref: "#/components/schemas/LogLine"
        - $ref: "#/components/schemas/LogNotice"
        - $ref: "#/components/schemas/LogEnd"
    LogLine:
      type: object
      required: [type, ts, stream, text]
      properties:
        type:
          type: string
          enum: [line]
        ts:
          type: integer
          format: int64
          description: Unix milliseconds.
        stream:
          type: string
          enum: [stdout, stderr, journal]
        text:
          type: string
    LogNotice:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [notice]
        code:
          type: string
        message:
          type: string
        dropped:
          type: integer
          description: Lines lost because the viewer was too slow.
    LogEnd:
      type: object
      required: [type, reason]
      properties:
        type:
          type: string
          enum: [end]
        reason:
          type: string
        code:
          type: string
    CheckStatus:
      type: object
      required: [state, since, last_checked, last_latency_ms, last_error_code, last_detail]
      properties:
        state:
          type: string
          enum: [up, down, unknown]
        since:
          type: [string, "null"]
          format: date-time
        last_checked:
          type: [string, "null"]
          format: date-time
        last_latency_ms:
          type: [integer, "null"]
          format: int64
        last_error_code:
          type: string
        last_detail:
          type: string
    CheckRequest:
      type: object
      description: A check as the API receives it. Send `status` back unchanged if you fetched the document, or omit it.
      required: [name, type, runner, interval_s, timeout_s, retries, enabled]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [http, tcp, dns, tls, ping]
        runner:
          type: string
          description: Where the check runs; `server` for checks run by nuxd.
        interval_s:
          type: integer
        timeout_s:
          type: integer
        retries:
          type: integer
          maximum: 5
        enabled:
          type: boolean
        allow_private:
          type: boolean
          description: Permit private and loopback addresses. Off by default (SSRF guard).
        http:
          $ref: "#/components/schemas/HTTPConfig"
        tcp:
          $ref: "#/components/schemas/TCPConfig"
        dns:
          $ref: "#/components/schemas/DNSConfig"
        tls:
          $ref: "#/components/schemas/TLSConfig"
        ping:
          $ref: "#/components/schemas/PingConfig"
        status:
          $ref: "#/components/schemas/CheckStatus"
    HTTPConfig:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
        headers:
          type: array
          items:
            $ref: "#/components/schemas/CheckHeader"
        body:
          type: string
        auth:
          $ref: "#/components/schemas/CheckAuth"
        expected_status:
          type: array
          items:
            type: integer
        keyword:
          type: string
        json:
          type: object
          required: [path, op]
          properties:
            path:
              type: string
            op:
              type: string
              enum: [exists, equals]
            value:
              type: string
        verify_tls:
          type: boolean
        max_redirects:
          type: integer
        max_body_bytes:
          type: integer
    CheckHeader:
      type: object
      required: [name]
      properties:
        name:
          type: string
        value:
          type: string
        secret:
          type: boolean
        secret_value:
          $ref: "#/components/schemas/SecretInput"
    CheckAuth:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, basic, bearer]
        username:
          type: string
        password:
          $ref: "#/components/schemas/SecretInput"
        token:
          $ref: "#/components/schemas/SecretInput"
    SecretInput:
      description: |
        Write-only. A string sets or replaces the value, an empty string clears it, null or `{"set": true}`
        keeps the stored value. Responses only ever return `{"set": true|false}`.
      oneOf:
        - type: string
        - type: object
          required: [set]
          properties:
            set:
              type: boolean
    TCPConfig:
      type: object
      required: [host, port]
      properties:
        host:
          type: string
        port:
          type: integer
    DNSConfig:
      type: object
      required: [name, record_type]
      properties:
        name:
          type: string
        record_type:
          type: string
        resolver:
          type: string
        expected:
          type: array
          items:
            type: string
    TLSConfig:
      type: object
      required: [host]
      properties:
        host:
          type: string
        port:
          type: integer
        server_name:
          type: string
        warn_days:
          type: integer
        verify_chain:
          type: boolean
    PingConfig:
      type: object
      required: [host]
      properties:
        host:
          type: string
        count:
          type: integer
    CheckView:
      type: object
      description: A check with its status.
      required: [id, name, type, runner, interval_s, timeout_s, retries, enabled, allow_private, created_by, updated_by, created_at, updated_at, status]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [http, tcp, dns, tls, ping]
        runner:
          type: string
        interval_s:
          type: integer
        timeout_s:
          type: integer
        retries:
          type: integer
        enabled:
          type: boolean
        allow_private:
          type: boolean
        http:
          $ref: "#/components/schemas/HTTPConfig"
        tcp:
          $ref: "#/components/schemas/TCPConfig"
        dns:
          $ref: "#/components/schemas/DNSConfig"
        tls:
          $ref: "#/components/schemas/TLSConfig"
        ping:
          $ref: "#/components/schemas/PingConfig"
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CheckStatus"
    CheckPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckView"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    CheckResult:
      type: object
      required: [ts, status, latency_ms, error_code, detail]
      properties:
        ts:
          type: string
          format: date-time
        status:
          type: string
        latency_ms:
          type: integer
          format: int64
        error_code:
          type: string
        detail:
          type: string
    CheckResultPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    Uptime:
      type: object
      required: ["24h", "7d", "30d", "90d"]
      properties:
        "24h":
          type: [number, "null"]
        "7d":
          type: [number, "null"]
        "30d":
          type: [number, "null"]
        "90d":
          type: [number, "null"]
    Selector:
      type: object
      description: Narrows what a rule, route or silence applies to. Every non-empty field must match.
      properties:
        tags:
          type: array
          items:
            type: string
          description: "`key` or `key:value`; all must be present."
        ids:
          type: array
          items:
            type: string
        severity:
          type: array
          items:
            type: string
            enum: [info, warning, critical]
        kinds:
          type: array
          items:
            type: string
    RuleRequest:
      type: object
      required: [name, kind, severity, enabled, selector]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [check_down, host_offline, container_stopped, metric_threshold, tls_expiring]
        severity:
          type: string
          enum: [info, warning, critical]
        enabled:
          type: boolean
        selector:
          $ref: "#/components/schemas/Selector"
        params:
          type: object
          description: Kind-specific parameters, for example for_s, or metric and threshold for metric_threshold.
          additionalProperties: true
    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleRequest"
        - type: object
          required: [id, created_by, updated_by, created_at, updated_at]
          properties:
            id:
              type: string
            created_by:
              type: string
            updated_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    RulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    Alert:
      type: object
      required: [id, rule_id, rule_name, kind, severity, item_type, item_id, item_name, summary, link, state, opened_at, flap_count]
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        kind:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        item_type:
          type: string
        item_id:
          type: string
        item_name:
          type: string
        summary:
          type: string
        link:
          type: string
        state:
          type: string
          enum: [open, acked, resolved]
        opened_at:
          type: string
          format: date-time
        acked_by:
          type: string
        acked_at:
          type: [string, "null"]
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolve_reason:
          type: string
        flap_count:
          type: integer
        last_notified_at:
          type: [string, "null"]
          format: date-time
    AlertPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    SilenceRequest:
      type: object
      required: [kind, selector, starts_at, ends_at, reason]
      properties:
        kind:
          type: string
          enum: [silence, maintenance]
        selector:
          $ref: "#/components/schemas/Selector"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
    Silence:
      allOf:
        - $ref: "#/components/schemas/SilenceRequest"
        - type: object
          required: [id, created_by, created_at, state]
          properties:
            id:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            state:
              type: string
              enum: [scheduled, active, expired]
    SilencePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Silence"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    ChannelRequest:
      type: object
      required: [name, type, enabled, config]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [smtp, slack, teams, discord, telegram, webhook]
        enabled:
          type: boolean
        allow_private:
          type: boolean
        config:
          type: object
          description: Type-specific settings. Secret fields are write-only.
          additionalProperties: true
    Channel:
      allOf:
        - $ref: "#/components/schemas/ChannelRequest"
        - type: object
          required: [id, last_status, created_by, updated_by, created_at, updated_at]
          properties:
            id:
              type: string
            last_status:
              type: string
            last_error_code:
              type: string
            last_sent_at:
              type: [string, "null"]
              format: date-time
            created_by:
              type: string
            updated_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ChannelPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        next_cursor:
          $ref: "#/components/schemas/NullableCursor"
    Route:
      type: object
      required: [selector, channel_id, continue]
      properties:
        id:
          type: string
        selector:
          $ref: "#/components/schemas/Selector"
        channel_id:
          type: string
        continue:
          type: boolean
          description: Keep matching later routes after this one.
    RoutesDocument:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
    OK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    StatusPageComponent:
      type: object
      required: [id, name, check_ids]
      properties:
        id:
          type: string
        name:
          type: string
        check_ids:
          type: array
          items:
            type: string
    StatusPageRequest:
      type: object
      required: [slug, title, description, published, components]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        title:
          type: string
        description:
          type: string
        published:
          type: boolean
        components:
          type: array
          items:
            type: object
            required: [name, check_ids]
            properties:
              id:
                type: string
                description: Ignored on input; present so a fetched page can be sent back.
              name:
                type: string
              check_ids:
                type: array
                items:
                  type: string
    StatusPage:
      type: object
      required: [id, slug, title, description, published, components, created_at, updated_at]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        published:
          type: boolean
        components:
          type: array
          items:
            $ref: "#/components/schemas/StatusPageComponent"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StatusPageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatusPage"
    IncidentRequest:
      type: object
      required: [title, body, status, impact]
      properties:
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        impact:
          type: string
          enum: [none, minor, major]
    IncidentUpdateRequest:
      type: object
      required: [status, body]
      properties:
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        body:
          type: string
        impact:
          type: string
          enum: [none, minor, major]
    ResolveRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
    IncidentUpdate:
      type: object
      required: [status, body, created_by, at]
      properties:
        status:
          type: string
        body:
          type: string
        created_by:
          type: string
        at:
          type: string
          format: date-time
    Incident:
      type: object
      required: [id, page_id, title, body, status, impact, created_by, created_at, updated_at, updates]
      properties:
        id:
          type: string
        page_id:
          type: string
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        impact:
          type: string
          enum: [none, minor, major]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        updates:
          type: array
          items:
            $ref: "#/components/schemas/IncidentUpdate"
    IncidentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
