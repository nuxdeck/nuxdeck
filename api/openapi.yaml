# SPDX-License-Identifier: Apache-2.0
#
# Nux Deck REST API, version 1. Every route under /api/v1 is described here; the coverage test in
# internal/server/api/openapi_test.go fails when a route and this document disagree.
# Maintained by hand. `make api` regenerates pkg/client and web/src/lib/api/schema.d.ts from it.
openapi: 3.1.0
info:
  title: Nux Deck API
  version: 0.1.0
  summary: Operations console REST API
  description: |
    JSON over HTTPS. Every UI action is available here (CLI-1).

    Authentication: a browser signs in with `POST /auth/login` and receives the `__Host-nux_session`
    cookie plus a CSRF token. Scripts send `Authorization: Bearer <token>` with a personal API token
    from `POST /me/tokens`. Bearer requests skip CSRF.

    Errors share one shape, `{"error": {"code", "message", "hint", "field"}}`. Codes are stable and
    listed in `internal/errcode/codes.go`. Lists are cursor paginated: `cursor` is opaque, pass the
    previous `next_cursor` back; `limit` defaults to 50 and is at most 500.

    Writes that change an existing object need `If-Match` set to the ETag from the last read
    (428 when missing, 412 when stale). Every list and every call is filtered by the caller's scope.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Nux Deck
    url: https://nuxdeck.com
servers:
  - url: /
    description: The server that serves this document.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Setup
    description: First-run administrator setup.
  - name: Auth
    description: Sign-in, sign-out, second factor and single sign-on.
  - name: Account
    description: The signed-in user's profile, password, two-factor, sessions and API tokens.
  - name: Users
    description: User administration (admin).
  - name: Role bindings
    description: Role and scope grants (admin).
  - name: Settings
    description: Server settings, telemetry and single sign-on configuration (admin).
  - name: Audit
    description: Audit search, export and chain verification (admin).
  - name: Agents
    description: Agent enrolment tokens and revocation (admin).
  - name: Inventory
    description: Hosts, containers, tags, owners and live events.
  - name: Search
    description: Command palette search across hosts and containers.
  - name: Metrics
    description: Chart data and resource pressure.
  - name: Logs
    description: Live log tail over WebSocket.
  - name: Checks
    description: Uptime checks, their results and uptime figures.
  - name: Alerts
    description: Alert rules, alerts, silences, notification channels and routes.
  - name: Status pages
    description: Public status pages and their incidents.
  - name: Meta
    description: The API description itself.
paths:
  /api/v1/setup/status:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      summary: Report whether first-run setup is still required
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/setup/admin:
    post:
      tags: [Setup]
      operationId: postSetupAdmin
      summary: Create the first administrator
      description: Needs the setup token printed by the server at first start. Signs the new administrator in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "201":
          description: Administrator created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Sign in with email and password
      description: |
        When the account has two-factor enabled, the response is a `pending` ticket instead of a
        session. Send the ticket and a code to `POST /auth/totp/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, or a second factor is pending.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/PendingLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: End the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session ended; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearSessionCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/verify:
    post:
      tags: [Auth]
      operationId: postAuthTOTPVerify
      summary: Complete sign-in with a second factor
      description: The code is a six-digit TOTP or an unused recovery code. Recovery codes are returned only when a session is issued by enrolment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enrol:
    post:
      tags: [Auth]
      operationId: postAuthTOTPEnrol
      summary: Start two-factor enrolment during sign-in
      description: Used when the account must enrol before it can finish signing in. The ticket comes from the pending login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPPendingEnrolRequest"
      responses:
        "200":
          description: Secret and provisioning URI for an authenticator app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/status:
    get:
      tags: [Auth]
      operationId: getOIDCStatus
      summary: Report whether single sign-on is enabled
      security: []
      responses:
        "200":
          description: Single sign-on state for the sign-in page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      operationId: getOIDCStart
      summary: Begin single sign-on
      description: Redirects the browser to the identity provider with a PKCE challenge and state. Disabled sign-in answers with an error redirect to the login page.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorisation URL.
              schema:
                type: string
                format: uri
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: getOIDCCallback
      summary: Finish single sign-on
      description: Receives the provider's redirect, checks state and the ID token, then sets the session cookie and redirects to the UI. Failures redirect to the login page with `sso_error` set to a stable code.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorisation code from the provider.
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          description: The state value sent by `start`.
          schema:
            type: string
            maxLength: 512
      responses:
        "302":
          description: Signed in, or redirected to the login page with `sso_error`.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
            Location:
              description: The UI page to continue to.
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in user and a fresh CSRF token
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    post:
      tags: [Account]
      operationId: postMePassword
      summary: Change my password
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/security:
    get:
      tags: [Account]
      operationId: getMySecurity
      summary: Get my two-factor state
      responses:
        "200":
          description: Two-factor state for the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySecurity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/enrol:
    post:
      tags: [Account]
      operationId: postMeTOTPEnrol
      summary: Start authenticator enrolment
      description: Returns a secret that stays pending until `confirm` accepts a code from it.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Secret and provisioning URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/confirm:
    post:
      tags: [Account]
      operationId: postMeTOTPConfirm
      summary: Confirm authenticator enrolment
      description: Turns two-factor on and returns the recovery codes once. They cannot be shown again.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirmRequest"
      responses:
        "200":
          description: Two-factor enabled; recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/totp/disable:
    post:
      tags: [Account]
      operationId: postMeTOTPDisable
      summary: Turn off two-factor
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "204":
          description: Two-factor disabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/sessions:
    get:
      tags: [Account]
      operationId: listMySessions
      summary: List my sessions
      responses:
        "200":
          description: Active sessions, the current one marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/sessions/{handle}:
    parameters:
      - $ref: "#/components/parameters/SessionHandle"
    delete:
      tags: [Account]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/tokens:
    get:
      tags: [Account]
      operationId: listMyTokens
      summary: List my API tokens
      description: Token values are never returned after creation.
      responses:
        "200":
          description: Tokens without their secret values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Account]
      operationId: createMyToken
      summary: Create an API token
      description: The plain token is in the response once. Bindings cannot exceed the creator's own access.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created; the value is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      tags: [Account]
      operationId: revokeMyToken
      summary: Revoke one of my API tokens
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Token revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: All accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's name, role or disabled flag
      description: Only the fields present are changed.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: User deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Set a new password for a user
      description: Ends the user's sessions.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: List a user's sessions
      responses:
        "200":
          description: Active sessions of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/{id}/sessions/{handle}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/SessionHandle"
    delete:
      tags: [Users]
      operationId: revokeUserSession
      summary: Revoke one of a user's sessions
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/settings/security:
    get:
      tags: [Users]
      operationId: getSecuritySettings
      summary: Get the server-wide two-factor requirement
      responses:
        "200":
          description: Whether every user must use two-factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Users]
      operationId: putSecuritySettings
      summary: Require or stop requiring two-factor for every user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySettings"
      responses:
        "200":
          description: Saved setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/role-bindings:
    get:
      tags: [Role bindings]
      operationId: listRoleBindings
      summary: List role bindings
      responses:
        "200":
          description: All bindings. A binding with `invalid` true no longer matches an existing subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Role bindings]
      operationId: createRoleBinding
      summary: Grant a role to a subject, optionally scoped
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBindingRequest"
      responses:
        "201":
          description: Binding created. The Location header names it.
          headers:
            Location:
              description: The binding's path.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/role-bindings/{id}:
    parameters:
      - $ref: "#/components/parameters/RoleBindingID"
    delete:
      tags: [Role bindings]
      operationId: deleteRoleBinding
      summary: Remove a role binding
      description: The last unscoped admin binding cannot be removed (AUTH-RBAC-003).
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Binding removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get editable server settings
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Settings]
      operationId: putSetting
      summary: Change one editable setting
      description: Only the keys listed in the response of `GET /settings` can be written. `telemetry.enabled` is refused while `telemetry.locked` is true. `server.public_url` must be an http or https address with a host and no credentials, path, query or fragment.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/settings/oidc:
    get:
      tags: [Settings]
      operationId: getOIDCSettings
      summary: Get the single sign-on configuration
      responses:
        "200":
          description: Configuration without the client secret; `client_secret_set` says whether one is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Settings]
      operationId: putOIDCSettings
      summary: Save the single sign-on configuration
      description: "`client_secret` is write-only. It is stored encrypted and never returned."
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCSettingsInput"
      responses:
        "200":
          description: Saved configuration without the secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Settings]
      operationId: deleteOIDCSettings
      summary: Remove the single sign-on configuration
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Configuration removed; sign-in with a password remains.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/telemetry/preview:
    get:
      tags: [Settings]
      operationId: getTelemetryPreview
      summary: Preview the exact telemetry payload
      description: Shows what would be sent. Nothing is sent by this call.
      responses:
        "200":
          description: The payload as it would be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: searchAudit
      summary: Search the audit log, newest first
      parameters:
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetID"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditText"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries. Sensitive detail fields are masked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit/export:
    get:
      tags: [Audit]
      operationId: exportAudit
      summary: Export matching audit entries as JSON Lines
      description: Takes the same filters as search, without paging. Entries stream oldest first; one JSON object per line.
      parameters:
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditTargetType"
        - $ref: "#/components/parameters/AuditTargetID"
        - $ref: "#/components/parameters/AuditResult"
        - $ref: "#/components/parameters/AuditText"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: Attachment `nux-audit-<UTC time>.jsonl`.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit/verify:
    get:
      tags: [Audit]
      operationId: verifyAudit
      summary: Verify the audit hash chain
      responses:
        "200":
          description: Verification result. `ok` false means the chain is broken at `broken_at`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerify"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/agents/tokens:
    post:
      tags: [Agents]
      operationId: createAgentToken
      summary: Create an agent enrolment token
      description: The token is shown only in this response.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenRequest"
      responses:
        "201":
          description: Enrolment token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/agents/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      tags: [Agents]
      operationId: revokeAgent
      summary: Revoke an agent's certificate
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Agent revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/hosts:
    get:
      tags: [Inventory]
      operationId: listHosts
      summary: List hosts
      parameters:
        - name: status
          in: query
          description: Only hosts with this status.
          schema:
            type: string
            enum: [online, offline]
        - name: include_gone
          in: query
          description: Set to true to include hosts that have gone.
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of hosts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      tags: [Inventory]
      operationId: getHost
      summary: Get a host
      responses:
        "200":
          description: The host and its current ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/containers:
    get:
      tags: [Inventory]
      operationId: listContainers
      summary: List containers
      parameters:
        - name: host_id
          in: query
          description: Only containers on this host.
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        - name: state
          in: query
          description: Only containers in this state, for example running or exited.
          schema:
            type: string
            pattern: "^[a-z]{1,32}$"
        - name: include_gone
          in: query
          description: Set to true to include containers that have gone.
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of containers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/containers/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemID"
    get:
      tags: [Inventory]
      operationId: getContainer
      summary: Get a container
      responses:
        "200":
          description: The container and its current ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/events:
    get:
      tags: [Inventory]
      operationId: streamEvents
      summary: Stream inventory changes (Server-Sent Events)
      description: |
        `text/event-stream`. Each message has `id` (the sequence number), `event` (the event type) and
        `data` (an InventoryEvent JSON object). A `resync` event means the client missed events and must
        reload. The stream sends a comment about every 15 seconds and ends when the session ends. Events
        are filtered by the caller's scope. Reconnects send `retry: 3000`.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events carrying InventoryEvent JSON in `data`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/items/{type}/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/ItemType"
      - $ref: "#/components/parameters/ItemID"
    put:
      tags: [Inventory]
      operationId: putItemTags
      summary: Replace the tags of a host or container
      description: "Tags are `key: value` pairs. Needs `If-Match`."
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagsRequest"
      responses:
        "200":
          description: Updated item with a new ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Host"
                  - $ref: "#/components/schemas/Container"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/items/{type}/{id}/owner:
    parameters:
      - $ref: "#/components/parameters/ItemType"
      - $ref: "#/components/parameters/ItemID"
    put:
      tags: [Inventory]
      operationId: putItemOwner
      summary: Set or clear the owner of a host or container
      description: Needs `If-Match`. Omitting `owner` or sending null leaves it unchanged; an empty string clears it.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRequest"
      responses:
        "200":
          description: Updated item with a new ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Host"
                  - $ref: "#/components/schemas/Container"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/search:
    get:
      tags: [Search]
      operationId: searchInventory
      summary: Search hosts and containers by name, tag or address
      parameters:
        - name: q
          in: query
          required: true
          description: Text to match, at most 64 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          description: Maximum hits, from 1 to 50 (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Ranked hits within the caller's scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/metrics/query:
    get:
      tags: [Metrics]
      operationId: queryMetrics
      summary: Query a metric series for one host or container
      parameters:
        - name: target
          in: query
          required: true
          description: Host or container ID.
          schema:
            type: string
            pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        - name: metric
          in: query
          required: true
          description: Metric name from the catalogue, for example cpu, memory or disk.
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: Start, as Unix milliseconds or RFC 3339.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: End, as Unix milliseconds or RFC 3339.
          schema:
            type: string
        - name: step
          in: query
          description: Seconds per point, from 1 to 86400.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        - name: label
          in: query
          description: Label filter as name:value. Repeat up to four times.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 4
            items:
              type: string
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "500":
          $ref: "#/components/responses/Internal"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/overview/pressure:
    get:
      tags: [Metrics]
      operationId: getPressure
      summary: Rank hosts and containers by resource pressure
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ranked hosts and containers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressureReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        "500":
          $ref: "#/components/responses/Internal"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/logs/stream:
    get:
      tags: [Logs]
      operationId: streamLogs
      summary: Tail a container or journal unit (WebSocket)
      description: |
        Upgrades to a WebSocket that sends text frames of LogFrame JSON. The server asks the agent to open
        the source and closes the agent stream when the last viewer leaves. Each log open is audited
        (`logs.stream`). Without `Upgrade: websocket` the request is refused. A viewer who is out of scope
        gets 403 before anything reaches the agent.
      parameters:
        - name: target
          in: query
          required: true
          description: '`container:<containerID>` or `journal:<hostID>:<unit>`, where unit is a systemd unit name.'
          schema:
            type: string
            maxLength: 256
        - name: tail
          in: query
          description: Recent lines to replay, from 0 to 10000 (default 100).
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 100
        - name: filter
          in: query
          description: Plain text a line must contain, up to 256 characters.
          schema:
            type: string
            maxLength: 256
      responses:
        "101":
          description: Switching Protocols. Frames are LogFrame objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogFrame"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/checks:
    get:
      tags: [Checks]
      operationId: listChecks
      summary: List uptime checks with their status
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Checks]
      operationId: createCheck
      summary: Create an uptime check
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "201":
          description: Check created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              description: The check's path.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/checks/{id}:
    parameters:
      - $ref: "#/components/parameters/CheckID"
    get:
      tags: [Checks]
      operationId: getCheck
      summary: Get an uptime check
      responses:
        "200":
          description: The check with its ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Checks]
      operationId: updateCheck
      summary: Replace an uptime check
      description: Needs `If-Match`. A fetched document can be sent back as it is; its `status` is ignored.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: Updated check with a new ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Invalid"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Checks]
      operationId: deleteCheck
      summary: Delete an uptime check
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Check deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/checks/{id}/run:
    parameters:
      - $ref: "#/components/parameters/CheckID"
    post:
      tags: [Checks]
      operationId: runCheck
      summary: Run a check now
      description: Waits for the result. Too many runs in a short time answer 429 with `Retry-After`.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The result of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many runs. `Retry-After` gives seconds to wait.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/checks/{id}/results:
    parameters:
      - $ref: "#/components/parameters/CheckID"
    get:
      tags: [Checks]
      operationId: listCheckResults
      summary: List a check's recorded runs, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResultPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/checks/{id}/uptime:
    parameters:
      - $ref: "#/components/parameters/CheckID"
    get:
