name: staging

# Release gates. They run on pull requests into staging and main, and on every
# push to staging, so main only has to build, sign and publish.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test release scripts
        run: bash deploy/release/next-version_test.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: Find snapshot images
        id: images
        run: |
          nuxd=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^ghcr.io/nuxdeck/nuxd:.*amd64$' | head -n1)
          agent=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^ghcr.io/nuxdeck/nux-agent:.*amd64$' | head -n1)
          [ -n "$nuxd" ] && [ -n "$agent" ] || { echo "::error::snapshot images not found"; exit 1; }
          echo "nuxd=$nuxd" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
      - name: Trivy scan nuxd
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.nuxd }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan nux-agent
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.agent }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  reproducible:
    name: reproducible
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --snapshot --clean
      # Hashes live outside the workspace: an untracked file would mark the second
      # build's VCS stamp as dirty and make the binaries differ. The action does not
      # put goreleaser on PATH, so the rebuild runs through the action as well.
      - name: Hash first build
        run: (cd dist && find . -type f \( -name nuxd -o -name nux \) -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/first.txt"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --snapshot --clean
      - name: Compare second build
        run: |
          (cd dist && find . -type f \( -name nuxd -o -name nux \) -exec sha256sum {} + | sort -k2) > "$RUNNER_TEMP/second.txt"
          diff -u "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt" && echo "builds are reproducible"
