version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
