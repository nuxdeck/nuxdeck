version = 1

[[annotations]]
path = ["cmd/nuxd/**", "internal/server/**", "web/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Nux Deck Authors"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["cmd/nux/**", "internal/agent/**", "internal/errcode/**", "proto/**", "pkg/**", "deploy/**", "test/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Nux Deck Authors"
SPDX-License-Identifier = "Apache-2.0"

# Provisional: docs/ and repository metadata have no licence decision yet.
[[annotations]]
path = ["docs/**", "*.md", "Makefile", "go.mod", "go.sum", ".gitignore", ".editorconfig", ".golangci.yml", ".github/**", ".semgrepignore", "buf.yaml", "buf.gen.yaml", ".goreleaser.yaml", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Nux Deck Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Icon geometry copied from Lucide (ISC) and Feather (MIT).
[[annotations]]
path = "web/src/lib/ui/icons.ts"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# Filtered, lowercased subset of SecLists xato-net-10-million-passwords-1000000.txt.
[[annotations]]
path = "internal/server/auth/commonpasswords.txt"
precedence = "override"
SPDX-FileCopyrightText = "2018 Daniel Miessler"
SPDX-License-Identifier = "MIT"
